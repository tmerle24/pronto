name: Android APK (Cassa-App)

# Manual only. The web app deploys via deploy.sh; a new APK is only needed for
# native changes (Capacitor/plugin updates, icon, permissions, capacitor.config.ts).
# Put it online afterwards (README, "App für die Cassa"):
#   php artisan android:publish-apk tiamo-pronto.apk --app-version=<version_name>
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName, e.g. 1.0.0'
        required: true
        default: '1.0.0'
      version_code:
        description: 'versionCode (empty = run number). Must strictly increase.'
        required: false
        default: ''

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code || github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # no vite build: remote mode, the app loads everything from the website.
      # Generates capacitor-cordova-android-plugins/ and copies android-web/ (offline.html).
      - name: Capacitor sync
        run: npx cap sync android

      - name: Unpack signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK not found (unsigned build is named app-release-unsigned.apk)"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          mv "$APK" app/build/outputs/apk/release/tiamo-pronto.apk
          sha256sum app/build/outputs/apk/release/tiamo-pronto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tiamo-pronto-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          retention-days: 30
          path: android/app/build/outputs/apk/release/tiamo-pronto.apk
