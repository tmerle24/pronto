<!--
  Bundled into the APK (capacitor.config.ts server.errorPath): shown when the
  live site cannot be reached at all, e.g. no network at app start.
-->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TIAMO Pronto - Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif; background: #FBF4E6; color: #1E1A17;
            min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1rem; padding: 2rem; text-align: center;
        }
        svg { width: 96px; height: 96px; }
        h1 { font-size: 1.6rem; }
        p { max-width: 22rem; line-height: 1.5; color: #6B625A; }
        button { margin-top: 1rem; height: 64px; padding: 0 2rem; border: 0; border-radius: 16px; background: #B8202B; color: #fff; font-size: 1.2rem; font-weight: 800; }
    </style>
</head>
<body>
    <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#B8202B"/><circle cx="100" cy="100" r="78.72" fill="none" stroke="#FBF4E6" stroke-width="4.80" stroke-dasharray="6.72 8.16"/><path fill="#FBF4E6" transform="translate(55.84 61.60) scale(3.6800)" d="M12 21 C-4 10 2 -2 12 5 C22 -2 28 10 12 21Z"/></svg>
    <h1>Keine Verbindung</h1>
    <p>Pronto ist gerade nicht erreichbar. WLAN oder mobile Daten prüfen und nochmal versuchen.</p>
    <button type="button" onclick="location.href='https://pronto.tiamo-pizza.de/team/counter'">Nochmal versuchen</button>
</body>
</html>
